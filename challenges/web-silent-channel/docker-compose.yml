name: ${CTF_SLUG}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# LAMP images run their own entrypoint, bind :80 and drop root->www-data, so they
# keep default caps and a writable rootfs (documented in challenge.yml). We still
# apply no-new-privileges, restart policy, limits and log rotation.
x-lamp-hardening: &lamp-hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    <<: *lamp-hardening
    image: mysql:8.0
    container_name: ctf_${CTF_SLUG}_db
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ./db.env
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
          pids: 512
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  wordpress:
    <<: *lamp-hardening
    build: ./build
    image: ${IMAGE}
    container_name: ctf_${CTF_SLUG}_wp
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./db.env          # WORDPRESS_DB_USER / _PASSWORD / _NAME
      - ./flags.env       # FLAG (written to /flag.txt at start)
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DEBUG: "false"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - wp_data:/var/www/html
    networks: [backend, frontend]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
          pids: 512
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/wp-login.php')===false?1:0);"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    labels:
      ctf.task: "${CTF_SLUG}"
      ctf.category: "${CTF_CATEGORY}"
      ctf.port: "${HOST_PORT}"

  # One-shot installer. Idempotent (checks wp core is-installed). Exits when done.
  wpcli:
    image: wordpress:cli-php8.0
    container_name: ctf_${CTF_SLUG}_wpcli
    depends_on:
      wordpress:
        condition: service_healthy
    env_file:
      - ./db.env
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WP_SITE_URL: "${WP_SITE_URL}"
    volumes:
      - wp_data:/var/www/html
    networks: [backend]
    user: "33:33"
    # Literal block (|) preserves newlines so no line-continuations are needed.
    # $$VAR is passed through to the container shell (reads WP_SITE_URL / WORDPRESS_DB_PASSWORD from env).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if wp core is-installed --path=/var/www/html 2>/dev/null; then
          echo '[*] WordPress already installed, skipping.'
          exit 0
        fi
        echo '[*] Installing WordPress...'
        wp core install --path=/var/www/html --url="$${WP_SITE_URL}" --title='TechCorp Employee Portal' --admin_user=admin --admin_password="$${WORDPRESS_DB_PASSWORD}" --admin_email='admin@techcorp.local' --skip-email
        wp user create j.doe jdoe@techcorp.local --path=/var/www/html --user_pass='employee2024!' --role=author --display_name='John Doe (Marketing)' || true
        wp option update blogdescription 'Internal portal - employees only' --path=/var/www/html
        echo '[+] Setup complete.'
    logging: *default-logging

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true          # DB + wpcli isolated; no host/internet route

volumes:
  db_data:
  wp_data:
