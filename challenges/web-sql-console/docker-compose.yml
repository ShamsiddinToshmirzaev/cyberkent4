name: ${CTF_SLUG}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Single-container LAMP (Apache+PHP+MariaDB): keeps default caps + writable rootfs
# (see challenge.yml hardening_exceptions). MariaDB binds localhost in-container and is
# never host-published. Single container by design: the LOAD_FILE exploit reads a local file.
x-lamp-hardening: &lamp-hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  app:
    <<: *lamp-hardening
    build: ./build
    image: ${IMAGE}
    container_name: ctf_${CTF_SLUG}_app
    ports:
      - "${HOST_PORT}:80"            # only Apache/80 is published; MariaDB/3306 stays in-container
    env_file:
      - ./flags.env                 # FLAG injected at runtime
      - ./db.env                    # DB config injected at runtime
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
          pids: 512
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php')===false?1:0);"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      ctf.task: "${CTF_SLUG}"
      ctf.category: "${CTF_CATEGORY}"
      ctf.port: "${HOST_PORT}"
    networks: [frontend]

networks:
  frontend:
    driver: bridge
