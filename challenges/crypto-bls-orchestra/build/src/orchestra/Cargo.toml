[package]
name = "orchestra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestra"
path = "src/main.rs"

[dependencies]
bls12_381 = { version = "0.9.0", features = ["experimental"] }
ff = "0.14.0"
group = "0.14.0"
rand = "0.10"
rand_core = "0.10"
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3
