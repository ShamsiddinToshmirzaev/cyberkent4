# Single hardened service. Each `up` generates a fresh random instance.
#   docker compose -f deploy/docker-compose.yml up --build
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "9150"
    ports:
      - "9150:9150"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    healthcheck:
      test: ["CMD", "python3", "deploy/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
