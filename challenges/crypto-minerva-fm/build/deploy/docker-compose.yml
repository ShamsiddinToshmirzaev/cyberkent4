# Three services, two volumes: the gateway never mounts the volume holding the
# private key (only the signer does). Only the gateway port is published.
#   docker compose -f deploy/docker-compose.yml up --build
x-image: &image
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  init:
    <<: *image
    user: root
    command: ["sh","-c","python3 instance/generate.py --profile prod --out /key/instance.json --gateway-out /gw/gateway.json --player-dir /gw/samples && chmod -R a+rX /key /gw"]
    volumes: [key:/key, gw:/gw]

  signer:
    <<: *image
    command: python3 deploy/signer_entry.py
    environment:
      INSTANCE: /key/instance.json
      SIGNER_BIND: 0.0.0.0
    volumes: [key:/key:ro]                 # key ONLY here
    depends_on:
      init: { condition: service_completed_successfully }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true, seccomp=./seccomp.json]

  gateway:
    <<: *image
    command: python3 src/gateway/gateway.py
    environment:
      INSTANCE: /gw/gateway.json           # reduced config, no key
      GATEWAY_BIND: 0.0.0.0
      SIGNER_HOST: signer
    volumes: [gw:/gw:ro]
    depends_on:
      init: { condition: service_completed_successfully }
      signer: { condition: service_started }
    ports: ["9030:9030"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true, seccomp=./seccomp.json]
    healthcheck:
      test: ["CMD", "bash", "deploy/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  internal: {}
volumes:
  key: {}
  gw: {}
