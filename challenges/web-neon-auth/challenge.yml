name: "Neon Core Auth"
slug: web-neon-auth
category: web
difficulty: medium
author: o.ruzimatov@csec.uz
host_port: 10007
internal_ports: []
image: ctf/web-neon-auth:1.0.0
stateful: true
healthcheck_url: "http://TARGET/"
flag_format: "CTF{...}"
solution:
  cmd: "python3 solution/smoke_test.py"
reset:
  policy: scheduled
hardening_exceptions: ["read_only", "user", "cap_drop"]
notes: "robots.txt -> leaked vim swap /.index.php.swp discloses source -> SQL injection in the login form. DB user has GRANT FILE and secure_file_priv=\"\" (deliberate), so UNION ... LOAD_FILE('/tmp/office.txt') reads the flag. Single-container LAMP (php:8.2-apache + MariaDB in-container, DB never host-published). The FILE priv + secure_file_priv weakening are the intended vuln. Flag from flags.env, DB creds from db.env; provisioning idempotent (init.sql drops/recreates)."
