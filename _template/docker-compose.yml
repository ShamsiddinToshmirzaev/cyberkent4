# Stateless single-service task template. Copy and adapt.
# No `version:` key (obsolete in Compose v2). Project name is set by ctfctl (-p <slug>).
name: ${CTF_SLUG}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build: ./build
    image: ${IMAGE}
    container_name: ctf_${CTF_SLUG}_app
    ports:
      - "${HOST_PORT}:5000"        # left = host (registry), right = in-container app port
    env_file:
      - ./flags.env                # FLAG=... injected at runtime; never baked into the image
    logging: *default-logging
    read_only: true                # drop if the app writes outside /tmp
    tmpfs:
      - /tmp
    user: "1000:1000"              # drop for images that need their own entrypoint/uid
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/').status < 500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      ctf.task: "${CTF_SLUG}"
      ctf.category: "${CTF_CATEGORY}"
      ctf.port: "${HOST_PORT}"
    networks: [frontend]

networks:
  frontend:
    driver: bridge
