name: "Human Readable Name"
slug: web-example              # kebab-case, matches folder + ports.csv
category: web                 # web | pwn | crypto | forensics | rev | misc
difficulty: medium            # easy | medium | hard
author: you@csec.uz
host_port: 100XX              # MUST match ports.csv
internal_ports: []            # ports used only between containers, never published
image: ctf/web-example:1.0.0  # pin a tag; bump on change
stateful: false               # true if it has a DB / writable state that players can trash
healthcheck_url: "http://TARGET/"
flag_format: "CTF4{...}"
solution:
  cmd: "python3 solution/smoke_test.py"
reset:
  policy: none                # none | scheduled  (scheduled tasks go on the reset cron)
hardening_exceptions: []      # e.g. ["read_only","user"] for LAMP images that need a writable rootfs
